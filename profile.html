<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Profile - zerøbyte</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white; padding: 20px; min-height: 100vh; }
.container { max-width: 600px; margin: 0 auto; }
.card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 24px; padding: 30px; border: 1px solid rgba(255, 255, 255, 0.1); }
h1 { margin-bottom: 10px; }
.subtitle { color: #94a3b8; margin-bottom: 25px; font-size: 14px; }
.avatar-section { text-align: center; margin-bottom: 25px; }
.avatar-preview { width: 100px; height: 100px; border-radius: 50px; background: linear-gradient(135deg, #7c3aed, #a855f7); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.avatar-preview i { font-size: 40px; color: white; }
.input-field { width: 100%; padding: 14px 16px; margin: 10px 0; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; background: rgba(255, 255, 255, 0.08); color: white; font-size: 16px; outline: none; }
.input-field:focus { border-color: #a855f7; }
button { width: 100%; padding: 14px; border: none; border-radius: 16px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
button.secondary { background: rgba(255,255,255,0.1); margin-top: 5px; }
.handle-box { background: rgba(168,85,247,0.1); padding: 12px; border-radius: 12px; margin: 15px 0; text-align: center; font-size: 13px; color: #a855f7; }
.alert { padding: 12px; border-radius: 12px; margin-top: 16px; font-size: 13px; display: none; }
.alert.success { background: rgba(34,197,94,0.2); color: #86efac; display: block; }
.alert.error { background: rgba(239,68,68,0.2); color: #fca5a5; display: block; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1><i class="fas fa-user-edit"></i> Complete Profile</h1>
        <p class="subtitle">Set up your profile to connect with others</p>
        <div class="avatar-section">
            <div class="avatar-preview" onclick="document.getElementById('avatarInput').click()" id="avatarPreview"><i class="fas fa-camera"></i></div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none">
            <small style="color:#64748b;">Click to upload avatar</small>
        </div>
        <input type="text" id="displayName" class="input-field" placeholder="Display Name *">
        <input type="text" id="username" class="input-field" placeholder="Username *">
        <input type="date" id="dob" class="input-field">
        <input type="text" id="location" class="input-field" placeholder="Location">
        <textarea id="bio" class="input-field" placeholder="Bio" rows="3"></textarea>
        <div class="handle-box" id="handlePreview"><i class="fas fa-magic"></i> Your unique handle will be generated</div>
        <button id="saveBtn">Save Profile</button>
        <button class="secondary" onclick="location.href='home.html'">Skip for Now</button>
        <div id="alert" class="alert"></div>
    </div>
</div>
<script>
const _supabase = window.supabase.createClient(
    "https://ievgpyzphaialonfonof.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldmdweXpwaGFpYWxvbmZvbm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Njk2MTAsImV4cCI6MjA5NDI0NTYxMH0.tg3ao7uROEZqvw1Tlkpe2o5glMF7LNRDj6uYaOs_Zvs"
);
let currentUser = null;
let uploadedAvatarUrl = null;

document.getElementById("username").addEventListener("input", function() {
    const val = this.value.trim();
    if(val) { const rand = Math.floor(Math.random()*9000+1000); document.getElementById("handlePreview").innerHTML = `<i class="fas fa-magic"></i> Your ID: @${val.toLowerCase().replace(/[^a-z0-9]/g,'')}_${rand}`; }
});

document.getElementById("avatarInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const fileName = `${Date.now()}_${file.name}`;
    const { error } = await _supabase.storage.from('avatars').upload(fileName, file);
    if(error) { alert("Upload failed: " + error.message); return; }
    const { data } = _supabase.storage.from('avatars').getPublicUrl(fileName);
    uploadedAvatarUrl = data.publicUrl;
    document.getElementById("avatarPreview").innerHTML = `<img src="${uploadedAvatarUrl}">`;
});

document.getElementById("saveBtn").addEventListener("click", async () => {
    const { data: { user } } = await _supabase.auth.getUser();
    if(!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    const displayName = document.getElementById("displayName").value.trim();
    const username = document.getElementById("username").value.trim();
    if(!displayName || !username) { showAlert("Display name and username required", "error"); return; }
    const rand = Math.floor(Math.random()*9000+1000);
    const userHandle = username.toLowerCase().replace(/[^a-z0-9]/g,'') + '_' + rand;
    showAlert("Saving profile...", "success");
    const { error } = await _supabase.from("profiles").upsert({
        id: user.id, display_name: displayName, username: username, user_handle: userHandle,
        avatar_url: uploadedAvatarUrl, dob: document.getElementById("dob").value,
        location: document.getElementById("location").value, bio: document.getElementById("bio").value
    });
    if(error) { showAlert(error.message, "error"); return; }
    showAlert(`Profile saved! Your ID: @${userHandle}`, "success");
    setTimeout(() => { window.location.href = "home.html"; }, 1500);
});

function showAlert(msg, type) { const a = document.getElementById("alert"); a.className = `alert ${type}`; a.innerHTML = msg; }
</script>
</body>
</html>
