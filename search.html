<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Find Friends - zerøbyte</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white; padding: 20px; min-height: 100vh; }
.container { max-width: 600px; margin: 0 auto; }
.card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 24px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.1); }
h1 { margin-bottom: 10px; }
.subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
.search-box { display: flex; gap: 10px; margin-bottom: 25px; }
.search-box input { flex: 1; padding: 14px; border: none; border-radius: 16px; background: rgba(255,255,255,0.08); color: white; font-size: 16px; outline: none; }
.search-box button { padding: 14px 24px; border: none; border-radius: 16px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; cursor: pointer; }
.user-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 16px; margin-bottom: 10px; }
.user-avatar { width: 50px; height: 50px; border-radius: 25px; background: linear-gradient(135deg, #7c3aed, #a855f7); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-info h4 { margin-bottom: 5px; }
.user-info p { font-size: 12px; color: #94a3b8; }
.btn-sm { padding: 8px 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; cursor: pointer; }
.empty { text-align: center; padding: 40px; color: #64748b; }
.back-link { display: block; margin-top: 20px; color: #a855f7; text-decoration: none; text-align: center; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1><i class="fas fa-search"></i> Find Friends</h1>
        <p class="subtitle">Search by username or handle</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search... e.g., @john_1234">
            <button id="searchBtn">Search</button>
        </div>
        <div id="results"><div class="empty"><i class="fas fa-users"></i><p>Search for users to connect with</p></div></div>
        <a href="home.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>
<script>
const _supabase = window.supabase.createClient(
    "https://ievgpyzphaialonfonof.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldmdweXpwaGFpYWxvbmZvbm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Njk2MTAsImV4cCI6MjA5NDI0NTYxMH0.tg3ao7uROEZqvw1Tlkpe2o5glMF7LNRDj6uYaOs_Zvs"
);
let currentUser = null;

async function getCurrentUser() { const { data: { user } } = await _supabase.auth.getUser(); if(!user) window.location.href="login.html"; currentUser=user; }

async function search() {
    const term = document.getElementById("searchInput").value.trim();
    if(!term) return;
    document.getElementById("results").innerHTML = '<div class="empty"><i class="fas fa-spinner fa-pulse"></i> Searching...</div>';
    const { data } = await _supabase.from("profiles").select("*").or(`display_name.ilike.%${term}%,username.ilike.%${term}%,user_handle.ilike.%${term.replace('@','')}%`).neq("id", currentUser.id).limit(20);
    if(!data || data.length===0) { document.getElementById("results").innerHTML = '<div class="empty"><i class="fas fa-user-slash"></i><p>No users found</p></div>'; return; }
    document.getElementById("results").innerHTML = data.map(u => `<div class="user-card"><div style="display:flex;gap:15px;align-items:center;"><div class="user-avatar">${u.avatar_url ? `<img src="${u.avatar_url}">` : '<i class="fas fa-user"></i>'}</div><div class="user-info"><h4>${escapeHtml(u.display_name || u.username)}</h4><p>${u.user_handle ? '@'+u.user_handle : ''}</p></div></div><button class="btn-sm" onclick="addFriend('${u.id}')">Add Friend</button></div>`).join("");
}

async function addFriend(friendId) { await _supabase.from("connections").insert({ user_id: currentUser.id, friend_id: friendId, status: "pending" }); alert("Friend request sent!"); search(); }

function escapeHtml(t) { if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

document.getElementById("searchBtn").addEventListener("click", search);
document.getElementById("searchInput").addEventListener("keypress", (e) => { if(e.key === "Enter") search(); });

getCurrentUser();
</script>
</body>
</html>
