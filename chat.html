<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat - zerøbyte</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
.chat-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
.avatar { width: 45px; height: 45px; border-radius: 23px; background: linear-gradient(135deg, #7c3aed, #a855f7); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.online-status { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; border-radius: 5px; background: #64748b; border: 1px solid #1e1b4b; }
.online-status.online { background: #22c55e; }
.messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.message { display: flex; margin-bottom: 8px; }
.message.sent { justify-content: flex-end; }
.message.received { justify-content: flex-start; }
.bubble { max-width: 70%; padding: 10px 15px; border-radius: 20px; font-size: 14px; position: relative; }
.sent .bubble { background: linear-gradient(135deg, #7c3aed, #a855f7); border-bottom-right-radius: 5px; }
.received .bubble { background: rgba(255,255,255,0.1); border-bottom-left-radius: 5px; }
.time { font-size: 10px; opacity: 0.6; margin-top: 5px; display: block; }
.read-status { font-size: 10px; margin-left: 5px; color: #86efac; }
.typing-indicator { padding: 10px 20px; color: #94a3b8; font-size: 12px; display: flex; align-items: center; gap: 5px; }
.typing-dot { width: 6px; height: 6px; border-radius: 3px; background: #a855f7; display: inline-block; animation: typing 1.4s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
.input-area { padding: 15px 20px; background: rgba(15, 23, 42, 0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
.input-area input { flex: 1; padding: 12px 16px; border: none; border-radius: 25px; background: rgba(255,255,255,0.1); color: white; outline: none; }
.input-area button { width: 45px; height: 45px; border: none; border-radius: 23px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; cursor: pointer; }
.empty { text-align: center; padding: 40px; color: #64748b; }
</style>
</head>
<body>
<div class="chat-header" id="chatHeader">
    <button class="back-btn" onclick="location.href='home.html'"><i class="fas fa-arrow-left"></i></button>
    <div class="avatar" id="headerAvatar"><i class="fas fa-user"></i><div class="online-status" id="onlineStatus"></div></div>
    <div><h3 id="chatName">Select a chat</h3><p id="chatHandle" style="font-size:12px;color:#94a3b8;"></p></div>
</div>
<div class="messages-area" id="messagesArea"><div class="empty"><i class="fas fa-comments"></i><p>Select a friend to start chatting</p></div></div>
<div id="typingIndicator" class="typing-indicator" style="display:none;"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span> typing...</div>
<div class="input-area" id="inputArea" style="display:none;">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
</div>

<script>
const _supabase = window.supabase.createClient(
    "https://ievgpyzphaialonfonof.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldmdweXpwaGFpYWxvbmZvbm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Njk2MTAsImV4cCI6MjA5NDI0NTYxMH0.tg3ao7uROEZqvw1Tlkpe2o5glMF7LNRDj6uYaOs_Zvs"
);
let currentUser = null, currentChatUser = null, channel = null;
let typingTimeout = null, isTyping = false;

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if(!user) { window.location.href="login.html"; return; }
    currentUser = user;
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user');
    if(userId) await loadChat(userId);
}

async function loadChat(userId) {
    const { data: profile } = await _supabase.from("profiles").select("*").eq("id", userId).single();
    if(profile) {
        currentChatUser = profile;
        document.getElementById("chatName").innerText = profile.display_name || profile.username;
        document.getElementById("chatHandle").innerHTML = profile.user_handle ? '@'+profile.user_handle : '';
        if(profile.avatar_url) document.getElementById("headerAvatar").innerHTML = `<img src="${profile.avatar_url}"><div class="online-status ${profile.is_online ? 'online' : ''}" id="onlineStatus"></div>`;
        document.getElementById("onlineStatus").className = `online-status ${profile.is_online ? 'online' : ''}`;
        document.getElementById("inputArea").style.display = "flex";
        await loadMessages();
        await markMessagesAsRead();
        setupRealtime();
    }
}

async function loadMessages() {
    const { data } = await _supabase.from("messages").select("*").or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`).order("created_at");
    const area = document.getElementById("messagesArea");
    area.innerHTML = "";
    if(!data||data.length===0) { area.innerHTML = '<div class="empty"><i class="fas fa-comment-dots"></i><p>No messages yet. Send a message!</p></div>'; return; }
    data.forEach(msg => { 
        const div = document.createElement("div"); 
        div.className = `message ${msg.sender_id === currentUser.id ? 'sent' : 'received'}`; 
        const isRead = msg.read_at ? '<span class="read-status"><i class="fas fa-check-double"></i></span>' : (msg.sender_id === currentUser.id ? '<span class="read-status"><i class="fas fa-check"></i></span>' : '');
        div.innerHTML = `<div class="bubble"><div>${escapeHtml(msg.content)}</div><span class="time">${new Date(msg.created_at).toLocaleTimeString()} ${isRead}</span></div>`; 
        area.appendChild(div); 
    });
    area.scrollTop = area.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById("messageInput");
    const content = input.value.trim();
    if(!content||!currentChatUser) return;
    input.value = "";
    await _supabase.from("messages").insert({ sender_id: currentUser.id, receiver_id: currentChatUser.id, content: content });
    await loadMessages();
    await markMessagesAsRead();
}

async function markMessagesAsRead() {
    await _supabase.from("messages").update({ is_read: true, read_at: new Date() }).eq("sender_id", currentChatUser.id).eq("receiver_id", currentUser.id).eq("is_read", false);
}

function handleTyping() {
    if(!currentChatUser) return;
    if(!isTyping) {
        isTyping = true;
        _supabase.channel("typing").send({ type: "broadcast", event: "typing", payload: { user: currentUser.id, isTyping: true, to: currentChatUser.id } });
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
        isTyping = false;
        _supabase.channel("typing").send({ type: "broadcast", event: "typing", payload: { user: currentUser.id, isTyping: false, to: currentChatUser.id } });
    }, 1000);
}

function setupRealtime() {
    if(channel) channel.unsubscribe();
    
    // Messages subscription
    channel = _supabase.channel("chat")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
            const newMsg = payload.new;
            if((newMsg.sender_id === currentChatUser?.id && newMsg.receiver_id === currentUser.id) || (newMsg.sender_id === currentUser.id && newMsg.receiver_id === currentChatUser?.id)) {
                loadMessages();
                if(newMsg.sender_id === currentChatUser?.id) markMessagesAsRead();
            }
        })
        .on("broadcast", { event: "typing" }, (payload) => {
            if(payload.payload.user === currentChatUser?.id && payload.payload.to === currentUser.id) {
                const indicator = document.getElementById("typingIndicator");
                if(payload.payload.isTyping) indicator.style.display = "flex";
                else indicator.style.display = "none";
            }
        })
        .subscribe();
    
    // Online status subscription
    _supabase.channel("online-status")
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles" }, (payload) => {
            if(payload.new.id === currentChatUser?.id) {
                document.getElementById("onlineStatus").className = `online-status ${payload.new.is_online ? 'online' : ''}`;
            }
        })
        .subscribe();
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("messageInput").addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); else handleTyping(); });
document.getElementById("messageInput").addEventListener("input", handleTyping);

function escapeHtml(t) { if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

init();
</script>
</body>
</html>
