<!DOCTYPE html>
<html>
<head>
  <title>Debug Test</title>
</head>
<body>

<h2>Step Test</h2>

<button onclick="step()">Run Test</button>

<script>

function step(){

  alert("STEP 1 WORKS");

  setTimeout(() => {
    alert("STEP 2 WORKS (JS OK)");
  }, 500);

  setTimeout(() => {
    testFetch();
  }, 1000);

}

async function testFetch(){
  try {
    const res = await fetch("https://jsonplaceholder.typicode.com/todos/1");
    const data = await res.json();
    alert("FETCH OK: " + data.title);
  } catch (e) {
    alert("FETCH FAILED: " + e.message);
  }
}

</script>

</body>
</html>
