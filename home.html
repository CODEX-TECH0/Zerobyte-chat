<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard - zerøbyte</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white; padding: 20px; min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; }
.card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border-radius: 24px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
.logo h1 { font-size: 24px; background: linear-gradient(135deg, #fff, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logout-btn { background: rgba(239,68,68,0.2); border: none; padding: 10px 20px; border-radius: 12px; color: #fca5a5; cursor: pointer; }
.profile-card { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.avatar { width: 80px; height: 80px; border-radius: 40px; background: linear-gradient(135deg, #7c3aed, #a855f7); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar i { font-size: 40px; color: white; }
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; margin: 20px 0; }
.stat-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; text-align: center; cursor: pointer; }
.stat-number { font-size: 24px; font-weight: bold; color: #a855f7; }
.section-title { margin: 20px 0 15px 0; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
.friend-list, .requests-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
.friend-item, .request-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 16px; }
.friend-info { display: flex; align-items: center; gap: 12px; flex: 1; }
.friend-avatar { width: 45px; height: 45px; border-radius: 23px; background: linear-gradient(135deg, #7c3aed, #a855f7); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.friend-avatar img { width: 100%; height: 100%; object-fit: cover; }
.online-dot { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; border-radius: 5px; background: #22c55e; border: 1px solid #1e1b4b; }
.offline-dot { background: #64748b; }
.friend-details h4 { font-size: 14px; margin-bottom: 3px; }
.friend-details p { font-size: 11px; color: #94a3b8; }
.btn-sm { padding: 8px 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; cursor: pointer; font-size: 12px; }
.btn-accept { background: linear-gradient(135deg, #22c55e, #16a34a); margin-right: 8px; }
.btn-reject { background: linear-gradient(135deg, #ef4444, #dc2626); }
.empty { text-align: center; padding: 40px; color: #64748b; }
.badge { background: #a855f7; color: white; border-radius: 20px; padding: 4px 12px; font-size: 12px; }
@media (max-width: 600px) { .profile-card { flex-direction: column; text-align: center; } .stats-grid { grid-template-columns: repeat(3,1fr); } }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div class="logo"><h1><i class="fas fa-comment-dots"></i> zerøbyte</h1></div>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div id="profileSection" class="profile-card">
            <div class="avatar" id="avatar"><i class="fas fa-user"></i></div>
            <div><h2 id="displayName">Loading...</h2><p id="userHandle"></p></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card" onclick="document.getElementById('friendsSection').scrollIntoView()"><div class="stat-number" id="friendsCount">0</div><div>Friends</div></div>
            <div class="stat-card" onclick="document.getElementById('requestsSection').scrollIntoView()"><div class="stat-number" id="requestsCount">0</div><div>Requests</div></div>
            <div class="stat-card" onclick="location.href='chat.html'"><div class="stat-number" id="unreadCount">0</div><div>Unread</div></div>
        </div>
        
        <!-- Friend Requests Section -->
        <div id="requestsSection">
            <div class="section-title"><i class="fas fa-user-plus"></i> Friend Requests <span id="requestsBadge" class="badge" style="display:none;">0</span></div>
            <div id="requestsList" class="requests-list"><div class="empty">No pending requests</div></div>
        </div>
        
        <!-- Friends Section -->
        <div id="friendsSection">
            <div class="section-title"><i class="fas fa-users"></i> Your Friends</div>
            <div id="friendsList" class="friend-list"><div class="empty">Loading...</div></div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn-sm" onclick="location.href='profile.html'" style="flex:1;">Edit Profile</button>
            <button class="btn-sm" onclick="location.href='search.html'" style="flex:1;">Find Friends</button>
            <button class="btn-sm" onclick="location.href='chat.html'" style="flex:1;">Messages</button>
        </div>
    </div>
</div>

<script>
const _supabase = window.supabase.createClient(
    "https://ievgpyzphaialonfonof.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldmdweXpwaGFpYWxvbmZvbm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Njk2MTAsImV4cCI6MjA5NDI0NTYxMH0.tg3ao7uROEZqvw1Tlkpe2o5glMF7LNRDj6uYaOs_Zvs"
);
let currentUser = null;
let realtimeChannel = null;

async function updateOnlineStatus() {
    await _supabase.from("profiles").update({ last_seen: new Date(), is_online: true }).eq("id", currentUser.id);
}

async function loadUser() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    await updateOnlineStatus();
    
    const { data: profile } = await _supabase.from("profiles").select("*").eq("id", user.id).single();
    document.getElementById("displayName").innerText = profile?.display_name || user.email.split('@')[0];
    document.getElementById("userHandle").innerHTML = profile?.user_handle ? `<i class="fas fa-at"></i> ${profile.user_handle}` : "";
    if (profile?.avatar_url) document.getElementById("avatar").innerHTML = `<img src="${profile.avatar_url}">`;
    
    await loadFriendRequests();
    await loadFriends();
    await loadUnreadCount();
    setupRealtime();
    
    // Update online status every 30 seconds
    setInterval(updateOnlineStatus, 30000);
}

async function loadFriendRequests() {
    const { data: requests } = await _supabase
        .from("connections")
        .select("*, sender:sender_id(id, display_name, username, user_handle, avatar_url, is_online, last_seen)")
        .eq("friend_id", currentUser.id)
        .eq("status", "pending");
    
    document.getElementById("requestsCount").innerText = requests?.length || 0;
    const badge = document.getElementById("requestsBadge");
    if (requests?.length > 0) { badge.style.display = "inline-block"; badge.innerText = requests.length; }
    else { badge.style.display = "none"; }
    
    if (!requests || requests.length === 0) {
        document.getElementById("requestsList").innerHTML = '<div class="empty">No pending friend requests</div>';
        return;
    }
    
    document.getElementById("requestsList").innerHTML = requests.map(r => `
        <div class="request-item" id="request-${r.id}">
            <div class="friend-info">
                <div class="friend-avatar">
                    ${r.sender?.avatar_url ? `<img src="${r.sender.avatar_url}">` : '<i class="fas fa-user"></i>'}
                </div>
                <div class="friend-details">
                    <h4>${escapeHtml(r.sender?.display_name || r.sender?.username || 'User')}</h4>
                    <p>${r.sender?.user_handle ? '@'+r.sender.user_handle : ''}</p>
                </div>
            </div>
            <div>
                <button class="btn-sm btn-accept" onclick="acceptRequest('${r.id}', '${r.sender_id}')">Accept</button>
                <button class="btn-sm btn-reject" onclick="rejectRequest('${r.id}')">Reject</button>
            </div>
        </div>
    `).join("");
}

async function acceptRequest(requestId, senderId) {
    // Update connection status
    await _supabase.from("connections").update({ status: "accepted" }).eq("id", requestId);
    // Also create reverse connection
    await _supabase.from("connections").upsert({
        user_id: currentUser.id,
        friend_id: senderId,
        status: "accepted"
    });
    await loadFriendRequests();
    await loadFriends();
}

async function rejectRequest(requestId) {
    await _supabase.from("connections").delete().eq("id", requestId);
    await loadFriendRequests();
}

async function loadFriends() {
    const { data: connections } = await _supabase
        .from("connections")
        .select("friend_id")
        .eq("user_id", currentUser.id)
        .eq("status", "accepted");
    
    document.getElementById("friendsCount").innerText = connections?.length || 0;
    
    if (!connections || connections.length === 0) {
        document.getElementById("friendsList").innerHTML = '<div class="empty">No friends yet. <a href="search.html" style="color:#a855f7;">Find friends →</a></div>';
        return;
    }
    
    const friendIds = connections.map(c => c.friend_id);
    const { data: friends } = await _supabase
        .from("profiles")
        .select("*")
        .in("id", friendIds);
    
    if (friends) {
        // Sort online friends first
        friends.sort((a, b) => (b.is_online ? 1 : 0) - (a.is_online ? 1 : 0));
        document.getElementById("friendsList").innerHTML = friends.map(f => `
            <div class="friend-item">
                <div class="friend-info">
                    <div class="friend-avatar">
                        ${f.avatar_url ? `<img src="${f.avatar_url}">` : '<i class="fas fa-user"></i>'}
                        <div class="online-dot ${f.is_online ? '' : 'offline-dot'}"></div>
                    </div>
                    <div class="friend-details">
                        <h4>${escapeHtml(f.display_name || f.username)} ${f.is_online ? '<span style="color:#22c55e; font-size:10px;">● Online</span>' : '<span style="color:#64748b; font-size:10px;">● Offline</span>'}</h4>
                        <p>${f.user_handle ? '@'+f.user_handle : ''}</p>
                    </div>
                </div>
                <button class="btn-sm" onclick="messageUser('${f.id}')">Message</button>
            </div>
        `).join("");
    }
}

async function loadUnreadCount() {
    const { count } = await _supabase
        .from("messages")
        .select("*", { count: 'exact', head: true })
        .eq("receiver_id", currentUser.id)
        .eq("is_read", false);
    document.getElementById("unreadCount").innerText = count || 0;
}

function messageUser(id) { window.location.href = `chat.html?user=${id}`; }

function setupRealtime() {
    if (realtimeChannel) realtimeChannel.unsubscribe();
    
    realtimeChannel = _supabase
        .channel("home-updates")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "connections" }, () => { loadFriendRequests(); loadFriends(); })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "connections" }, () => { loadFriendRequests(); loadFriends(); })
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
            if (payload.new.receiver_id === currentUser?.id) {
                loadUnreadCount();
            }
        })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles" }, () => { loadFriends(); })
        .subscribe();
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
    await _supabase.from("profiles").update({ is_online: false, last_seen: new Date() }).eq("id", currentUser.id);
    await _supabase.auth.signOut();
    window.location.href = "index.html";
});

function escapeHtml(t) { if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

loadUser();

// Handle page visibility
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        _supabase.from("profiles").update({ is_online: false }).eq("id", currentUser?.id);
    } else {
        _supabase.from("profiles").update({ is_online: true, last_seen: new Date() }).eq("id", currentUser?.id);
        loadFriends();
    }
});
</script>
</body>
</html>
