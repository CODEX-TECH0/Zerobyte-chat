<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard - zerøbyte</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white; padding: 16px; min-height: 100vh; }
.container { max-width: 700px; margin: 0 auto; }
.card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border-radius: 28px; padding: 24px; margin-bottom: 16px; border: 1px solid rgba(255, 255, 255, 0.1); }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.logo h1 { font-size: 24px; background: linear-gradient(135deg, #fff, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo p { font-size: 11px; color: #64748b; }
.logout-btn { background: rgba(239,68,68,0.2); border: none; padding: 10px 18px; border-radius: 14px; color: #fca5a5; cursor: pointer; font-size: 14px; transition: 0.3s; }
.logout-btn:hover { background: rgba(239,68,68,0.4); }
.profile-card { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.avatar { width: 80px; height: 80px; border-radius: 40px; background: linear-gradient(135deg, #7c3aed, #a855f7); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; transition: 0.3s; }
.avatar:hover { transform: scale(1.05); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar i { font-size: 40px; color: white; }
.profile-info h2 { font-size: 22px; margin-bottom: 4px; }
.profile-info p { color: #a855f7; font-size: 13px; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
.stat-card { background: rgba(255,255,255,0.05); padding: 16px; border-radius: 18px; text-align: center; cursor: pointer; transition: 0.3s; }
.stat-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
.stat-number { font-size: 28px; font-weight: bold; color: #a855f7; }
.stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
.section-title { margin: 20px 0 15px 0; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
.section-title i { color: #a855f7; margin-right: 8px; }
.badge { background: #a855f7; color: white; border-radius: 20px; padding: 4px 12px; font-size: 12px; }
.friend-list, .requests-list { display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; }
.friend-item, .request-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.05); border-radius: 18px; transition: 0.3s; }
.friend-item:hover, .request-item:hover { background: rgba(255,255,255,0.08); }
.friend-info { display: flex; align-items: center; gap: 14px; flex: 1; }
.friend-avatar { width: 50px; height: 50px; border-radius: 25px; background: linear-gradient(135deg, #7c3aed, #a855f7); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; flex-shrink: 0; }
.friend-avatar img { width: 100%; height: 100%; object-fit: cover; }
.online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; border-radius: 6px; background: #22c55e; border: 2px solid #1e1b4b; }
.offline-dot { background: #64748b; }
.friend-details h4 { font-size: 15px; margin-bottom: 4px; }
.friend-details p { font-size: 11px; color: #94a3b8; }
.online-text { color: #22c55e; font-size: 10px; margin-left: 6px; }
.offline-text { color: #64748b; font-size: 10px; margin-left: 6px; }
.btn-sm { padding: 8px 18px; border: none; border-radius: 14px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; cursor: pointer; font-size: 12px; font-weight: 500; transition: 0.3s; }
.btn-sm:hover { transform: scale(1.05); }
.btn-accept { background: linear-gradient(135deg, #22c55e, #16a34a); margin-right: 8px; }
.btn-reject { background: linear-gradient(135deg, #ef4444, #dc2626); }
.action-buttons { display: flex; gap: 12px; margin-top: 20px; }
.action-buttons button { flex: 1; }
.empty { text-align: center; padding: 40px 20px; color: #64748b; }
.empty i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.notification { position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 400px; margin: 0 auto; background: #22c55e; color: white; padding: 14px 20px; border-radius: 16px; text-align: center; z-index: 1000; animation: slideUp 0.3s ease; display: none; font-size: 14px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
.notification.error { background: #ef4444; }
@keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 4px; }
@media (max-width: 600px) { .profile-card { flex-direction: column; text-align: center; } .stats-grid { gap: 8px; } .stat-number { font-size: 22px; } }
</style>
</head>
<body>
<div class="container">
    <!-- Main Card -->
    <div class="card">
        <div class="header">
            <div class="logo">
                <h1><i class="fas fa-comment-dots"></i> zerøbyte</h1>
                <p>Connect, Chat, Collaborate</p>
            </div>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <!-- Profile Section -->
        <div id="profileSection" class="profile-card">
            <div class="avatar" id="avatar" onclick="location.href='profile.html'">
                <i class="fas fa-user"></i>
            </div>
            <div class="profile-info">
                <h2 id="displayName">Loading...</h2>
                <p id="userHandle"><i class="fas fa-at"></i> Loading...</p>
            </div>
        </div>
        
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card" onclick="document.getElementById('friendsSection').scrollIntoView({behavior:'smooth'})">
                <div class="stat-number" id="friendsCount">0</div>
                <div class="stat-label"><i class="fas fa-users"></i> Friends</div>
            </div>
            <div class="stat-card" onclick="document.getElementById('requestsSection').scrollIntoView({behavior:'smooth'})">
                <div class="stat-number" id="requestsCount">0</div>
                <div class="stat-label"><i class="fas fa-user-plus"></i> Requests</div>
            </div>
            <div class="stat-card" onclick="location.href='chat.html'">
                <div class="stat-number" id="unreadCount">0</div>
                <div class="stat-label"><i class="fas fa-envelope"></i> Unread</div>
            </div>
        </div>
    </div>
    
    <!-- Friend Requests Section -->
    <div class="card" id="requestsSection">
        <div class="section-title">
            <span><i class="fas fa-user-plus"></i> Friend Requests</span>
            <span id="requestsBadge" class="badge" style="display:none;">0</span>
        </div>
        <div id="requestsList" class="requests-list">
            <div class="empty"><i class="fas fa-spinner fa-pulse"></i> Loading requests...</div>
        </div>
    </div>
    
    <!-- Friends Section -->
    <div class="card" id="friendsSection">
        <div class="section-title">
            <span><i class="fas fa-users"></i> Your Friends</span>
            <span id="friendsBadge" class="badge" style="display:none;">0</span>
        </div>
        <div id="friendsList" class="friend-list">
            <div class="empty"><i class="fas fa-spinner fa-pulse"></i> Loading friends...</div>
        </div>
    </div>
    
    <!-- Action Buttons -->
    <div class="card">
        <div class="action-buttons">
            <button class="btn-sm" onclick="location.href='profile.html'"><i class="fas fa-user-edit"></i> Edit Profile</button>
            <button class="btn-sm" onclick="location.href='search.html'"><i class="fas fa-search"></i> Find Friends</button>
            <button class="btn-sm" onclick="location.href='chat.html'"><i class="fas fa-comments"></i> Messages</button>
        </div>
    </div>
</div>

<div id="notification" class="notification"></div>

<script>
const _supabase = window.supabase.createClient(
    "https://ievgpyzphaialonfonof.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldmdweXpwaGFpYWxvbmZvbm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Njk2MTAsImV4cCI6MjA5NDI0NTYxMH0.tg3ao7uROEZqvw1Tlkpe2o5glMF7LNRDj6uYaOs_Zvs"
);

let currentUser = null;
let currentProfile = null;
let realtimeChannel = null;

// Show notification
function showNotification(message, isError = false) {
    const notif = document.getElementById("notification");
    notif.className = isError ? "notification error" : "notification";
    notif.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
    notif.style.display = "block";
    setTimeout(() => { notif.style.display = "none"; }, 3000);
}

// Update online status
async function updateOnlineStatus() {
    if (currentUser) {
        await _supabase
            .from("profiles")
            .update({ last_seen: new Date(), is_online: true })
            .eq("id", currentUser.id);
    }
}

// Load user profile
async function loadUserProfile() {
    const { data: { user }, error } = await _supabase.auth.getUser();
    if (error || !user) {
        window.location.href = "login.html";
        return;
    }
    currentUser = user;
    await updateOnlineStatus();
    
    const { data: profile } = await _supabase
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();
    
    currentProfile = profile;
    
    // Update display
    document.getElementById("displayName").innerText = profile?.display_name || user.email.split('@')[0];
    const handleText = profile?.user_handle ? `@${profile.user_handle}` : "Set up your profile";
    document.getElementById("userHandle").innerHTML = `<i class="fas fa-at"></i> ${handleText}`;
    
    if (profile?.avatar_url) {
        document.getElementById("avatar").innerHTML = `<img src="${profile.avatar_url}" alt="Avatar">`;
    }
    
    // Load all data
    await loadFriendRequests();
    await loadFriends();
    await loadUnreadCount();
    setupRealtime();
    
    // Update online status every 30 seconds
    setInterval(updateOnlineStatus, 30000);
}

// Load friend requests
async function loadFriendRequests() {
    const { data: requests, error } = await _supabase
        .from("connections")
        .select(`
            id,
            user_id,
            friend_id,
            status,
            created_at,
            sender:sender_id (
                id,
                display_name,
                username,
                user_handle,
                avatar_url,
                is_online
            )
        `)
        .eq("friend_id", currentUser.id)
        .eq("status", "pending");
    
    const requestCount = requests?.length || 0;
    document.getElementById("requestsCount").innerText = requestCount;
    
    const badge = document.getElementById("requestsBadge");
    if (requestCount > 0) {
        badge.style.display = "inline-block";
        badge.innerText = requestCount;
    } else {
        badge.style.display = "none";
    }
    
    if (!requests || requests.length === 0) {
        document.getElementById("requestsList").innerHTML = `
            <div class="empty">
                <i class="fas fa-user-check"></i>
                <p>No pending friend requests</p>
            </div>`;
        return;
    }
    
    document.getElementById("requestsList").innerHTML = requests.map(req => {
        const sender = req.sender;
        return `
            <div class="request-item" id="request-${req.id}">
                <div class="friend-info">
                    <div class="friend-avatar">
                        ${sender?.avatar_url ? `<img src="${sender.avatar_url}" alt="${sender.display_name}">` : '<i class="fas fa-user"></i>'}
                        ${sender?.is_online ? '<div class="online-dot"></div>' : ''}
                    </div>
                    <div class="friend-details">
                        <h4>${escapeHtml(sender?.display_name || sender?.username || 'User')}</h4>
                        <p>${sender?.user_handle ? '@' + sender.user_handle : ''}</p>
                    </div>
                </div>
                <div>
                    <button class="btn-sm btn-accept" onclick="acceptRequest('${req.id}', '${req.user_id}')">
                        <i class="fas fa-check"></i> Accept
                    </button>
                    <button class="btn-sm btn-reject" onclick="rejectRequest('${req.id}')">
                        <i class="fas fa-times"></i> Reject
                    </button>
                </div>
            </div>
        `;
    }).join("");
}

// Accept friend request
async function acceptRequest(requestId, senderId) {
    showNotification("Accepting request...");
    
    // Update the connection status
    const { error: updateError } = await _supabase
        .from("connections")
        .update({ status: "accepted" })
        .eq("id", requestId);
    
    if (updateError) {
        showNotification("Error: " + updateError.message, true);
        return;
    }
    
    // Create reverse connection (so sender also sees as friend)
    const { error: insertError } = await _supabase
        .from("connections")
        .upsert({
            user_id: currentUser.id,
            friend_id: senderId,
            status: "accepted"
        }, { onConflict: 'user_id,friend_id' });
    
    if (insertError) {
        showNotification("Error creating connection: " + insertError.message, true);
        return;
    }
    
    showNotification("Friend request accepted! You are now friends.");
    await loadFriendRequests();
    await loadFriends();
}

// Reject friend request
async function rejectRequest(requestId) {
    const { error } = await _supabase
        .from("connections")
        .delete()
        .eq("id", requestId);
    
    if (error) {
        showNotification("Error: " + error.message, true);
    } else {
        showNotification("Request rejected.");
        await loadFriendRequests();
    }
}

// Load friends list
async function loadFriends() {
    const { data: connections, error } = await _supabase
        .from("connections")
        .select("friend_id")
        .eq("user_id", currentUser.id)
        .eq("status", "accepted");
    
    const friendsCount = connections?.length || 0;
    document.getElementById("friendsCount").innerText = friendsCount;
    
    const friendsBadge = document.getElementById("friendsBadge");
    if (friendsCount > 0) {
        friendsBadge.style.display = "inline-block";
        friendsBadge.innerText = friendsCount;
    } else {
        friendsBadge.style.display = "none";
    }
    
    if (!connections || connections.length === 0) {
        document.getElementById("friendsList").innerHTML = `
            <div class="empty">
                <i class="fas fa-user-friends"></i>
                <p>No friends yet</p>
                <a href="search.html" style="color:#a855f7; text-decoration:none; margin-top:10px; display:inline-block;">Find friends →</a>
            </div>`;
        return;
    }
    
    const friendIds = connections.map(c => c.friend_id);
    const { data: friends } = await _supabase
        .from("profiles")
        .select("*")
        .in("id", friendIds);
    
    if (friends) {
        // Sort: online friends first, then offline
        friends.sort((a, b) => (b.is_online ? 1 : 0) - (a.is_online ? 1 : 0));
        
        document.getElementById("friendsList").innerHTML = friends.map(f => `
            <div class="friend-item">
                <div class="friend-info">
                    <div class="friend-avatar">
                        ${f.avatar_url ? `<img src="${f.avatar_url}" alt="${f.display_name}">` : '<i class="fas fa-user"></i>'}
                        <div class="online-dot ${f.is_online ? '' : 'offline-dot'}"></div>
                    </div>
                    <div class="friend-details">
                        <h4>
                            ${escapeHtml(f.display_name || f.username)}
                            ${f.is_online ? '<span class="online-text"><i class="fas fa-circle"></i> Online</span>' : '<span class="offline-text"><i class="fas fa-circle"></i> Offline</span>'}
                        </h4>
                        <p>${f.user_handle ? '@' + f.user_handle : ''}</p>
                        ${f.bio ? `<p style="font-size: 10px; margin-top: 4px; color:#64748b;">${escapeHtml(f.bio.substring(0, 40))}${f.bio.length > 40 ? '...' : ''}</p>` : ''}
                    </div>
                </div>
                <button class="btn-sm" onclick="messageUser('${f.id}')">
                    <i class="fas fa-comment"></i> Message
                </button>
            </div>
        `).join("");
    }
}

// Load unread messages count
async function loadUnreadCount() {
    const { count, error } = await _supabase
        .from("messages")
        .select("*", { count: 'exact', head: true })
        .eq("receiver_id", currentUser.id)
        .eq("is_read", false);
    
    document.getElementById("unreadCount").innerText = count || 0;
}

// Message a user
function messageUser(userId) {
    window.location.href = `chat.html?user=${userId}`;
}

// Setup realtime listeners
function setupRealtime() {
    if (realtimeChannel) {
        realtimeChannel.unsubscribe();
    }
    
    realtimeChannel = _supabase
        .channel("home-realtime")
        .on("postgres_changes", { 
            event: "INSERT", 
            schema: "public", 
            table: "connections" 
        }, () => {
            loadFriendRequests();
            loadFriends();
        })
        .on("postgres_changes", { 
            event: "UPDATE", 
            schema: "public", 
            table: "connections" 
        }, () => {
            loadFriendRequests();
            loadFriends();
        })
        .on("postgres_changes", { 
            event: "INSERT", 
            schema: "public", 
            table: "messages" 
        }, (payload) => {
            if (payload.new.receiver_id === currentUser?.id) {
                loadUnreadCount();
                showNotification(`New message from a friend!`, false);
            }
        })
        .on("postgres_changes", { 
            event: "UPDATE", 
            schema: "public", 
            table: "profiles" 
        }, () => {
            loadFriends();
        })
        .subscribe();
}

// Logout
async function logout() {
    await _supabase
        .from("profiles")
        .update({ is_online: false, last_seen: new Date() })
        .eq("id", currentUser.id);
    
    await _supabase.auth.signOut();
    window.location.href = "index.html";
}

// Escape HTML
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Handle page visibility (online/offline status)
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        if (currentUser) {
            _supabase
                .from("profiles")
                .update({ is_online: false })
                .eq("id", currentUser.id);
        }
    } else {
        if (currentUser) {
            _supabase
                .from("profiles")
                .update({ is_online: true, last_seen: new Date() })
                .eq("id", currentUser.id);
            loadFriends();
        }
    }
});

// Event listeners
document.getElementById("logoutBtn").addEventListener("click", logout);

// Initialize
loadUserProfile();
</script>
</body>
</html>
